# Museum TillRea — konfigurasi Nginx (sumber persisten).
# Disalin ke /etc/nginx/conf.d/museum.conf oleh start-hosting.sh.

# Lobi museum: domain utama
server {
    listen 8080;
    server_name tillrea.my.id www.tillrea.my.id;
    root /home/hatch/workspace/www/main;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    # API Ruang Pameran (panel admin + daftar karya dinamis) -> layanan lokal port 8091
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Panel admin pameran: /admin -> admin.html
    location = /admin { add_header Cache-Control "no-cache"; try_files /admin.html =404; }
    # File HTML tidak boleh disimpan cache browser (perubahan lobi langsung terlihat)
    location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /admin.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
}

# n8n: subdomain khusus -> reverse proxy ke n8n lokal port 5678.
# server_name exact di sini menang dari regex wildcard pameran di bawah.
server {
    listen 8080;
    server_name n8n.tillrea.my.id;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

# Pameran: wildcard subdomain -> folder subdomains/<nama>
# Nama subdomain ditangkap regex, jadi folder baru otomatis jadi situs.
server {
    listen 8080;
    server_name ~^(?<subdomain>[a-z0-9-]+)\.tillrea\.my\.id$;
    root /home/hatch/workspace/www/subdomains/$subdomain;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
