# Museum TillRea — konfigurasi Nginx (sumber persisten).
# Disalin ke /etc/nginx/conf.d/museum.conf oleh start-hosting.sh.

server_tokens off;

# Lobi museum: domain utama
server {
    listen 127.0.0.1:8080;
    server_name tillrea.my.id www.tillrea.my.id;
    # Paksa HTTPS: trafik sah selalu lewat tunnel Cloudflare (yang meneruskan
    # skema pengunjung di X-Forwarded-Proto); cek lokal tanpa header tidak terusik.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    # Header keamanan (audit 2026-10-10)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /home/hatch/workspace/www/main;
    index index.html;
    # Upload ZIP cPanel mini di /admin bisa sampai 50 MB (default Nginx 1 MB)
    client_max_body_size 50m;
    # Kompresi teks di origin (mempercepat transfer lewat tunnel)
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    # Aset Vite bernama hash (konten berubah = nama berubah): aman di-cache lama
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    # API Ruang Pameran (panel admin + daftar karya dinamis) -> layanan lokal port 8091
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Panel admin pameran: /admin -> admin.html
    location = /admin {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /admin.html =404;
    }
    # Halaman berkas (PIN): /berkas -> berkas.html
    location = /berkas {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /berkas.html =404;
    }
    location = /berkas.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    # File HTML tidak boleh disimpan cache browser (perubahan lobi langsung terlihat)
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    location = /admin.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}

# n8n: subdomain khusus -> reverse proxy ke n8n lokal port 5678.
# server_name exact di sini menang dari regex wildcard pameran di bawah.
server {
    listen 127.0.0.1:8080;
    server_name n8n.tillrea.my.id;
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

# 9Router: subdomain khusus -> reverse proxy ke dasbor 9Router lokal port 20128.
# Dibuka atas permintaan Fikri (2026-10-10) supaya bisa dikontrol seperti n8n;
# gerbangnya password dasbor yang Fikri atur sendiri. Exact name menang dari wildcard.
server {
    listen 127.0.0.1:8080;
    server_name 9router.tillrea.my.id;
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}

# Pameran: wildcard subdomain -> folder subdomains/<nama>
# Nama subdomain ditangkap regex, jadi folder baru otomatis jadi situs.
server {
    listen 127.0.0.1:8080;
    server_name ~^(?<subdomain>[a-z0-9-]+)\.tillrea\.my\.id$;
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /home/hatch/workspace/www/subdomains/$subdomain;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
