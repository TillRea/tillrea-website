  <script>
      // Override oleh Muse: kosongkan section kartu ruangan pameran (ROOM I/II/III).
      // Target utama: <section id="ruang-pameran">, diverifikasi memuat ketiga judul ruangan.
      // Cadangan: panjat DOM dari judul pertama; blok harus memuat ketiga judul + tepat 3
      // tombol paviliun dan tidak memuat footer. Teks tombol diterima dua versi: build lama
      // "Kunjungi Paviliun" dan build hasil refactor "Live Preview" (keduanya dihitung).
      // Teks dibandingkan tanpa memedulikan huruf besar/kecil dan whitespace
      // (tombol tampil uppercase via CSS).
      (function () {
        var TITLES = ['sistem pendukung keputusan', 'scraft product web refactor', 'pesona kaliwungu'];
        function norm(s) { return (s || '').toLowerCase().replace(/\s+/g, ''); }
        function hasAll(el) {
          var txt = norm(el.textContent);
          return TITLES.every(function (t) { return txt.indexOf(norm(t)) !== -1; });
        }
        function isRoomsBlock(el) {
          if (el.hasAttribute && el.hasAttribute('data-muse-rooms')) return false;
          if (!hasAll(el)) return false;
          var txtNorm = norm(el.textContent);
          var btns = (txtNorm.split('kunjungipaviliun').length - 1) +
                     (txtNorm.split('livepreview').length - 1);
          return btns === 3 && !el.querySelector('footer');
        }
        function findAnchor() {
          var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          var n;
          while ((n = w.nextNode())) {
            if (n.nodeValue && norm(n.nodeValue).indexOf(norm(TITLES[0])) !== -1) {
              if (n.parentElement && n.parentElement.closest('[data-muse-rooms]')) continue;
              return n.parentElement;
            }
          }
          return null;
        }
        function findBlock() {
          var byId = document.getElementById('ruang-pameran');
          if (byId && !byId.hasAttribute('data-muse-rooms') && hasAll(byId)) return byId;
          var anchor = findAnchor();
          if (!anchor) return null;
          var sec = anchor.closest('section');
          if (sec && isRoomsBlock(sec)) return sec;
          var el = anchor;
          while (el && el !== document.body) {
            if (isRoomsBlock(el)) return el;
            el = el.parentElement;
          }
          return null;
        }
        function hide() {
          var b = findBlock();
          if (b) {
            b.style.setProperty('display', 'none', 'important');
            // Lepas id-nya: id "ruang-pameran" kini milik section dinamis dari panel admin.
            if (b.id === 'ruang-pameran') b.removeAttribute('id');
          }
        }
        var obs = new MutationObserver(hide);
        function start() {
          hide();
          if (document.body) obs.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () { obs.disconnect(); }, 15000);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
        else start();
      })();
    </script>
<script>
      // Override oleh Muse (2): navigasi tanpa mengubah URL + Ruang Pameran dinamis.
      (function () {
        // --- 0. Alamat harus selalu bersih: buang hash apa pun yang terlanjur ada di URL.
        function bersihkanUrl() {
          if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          }
        }
        bersihkanUrl();
        // --- 1. Klik menu/anchor: scroll halus TANPA mengubah alamat (hash) di URL.
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
          if (!a) return;
          var hash = a.getAttribute('href');
          if (!hash || hash.length < 2) return;
          var id = hash.slice(1);
          var cands = document.querySelectorAll('[id="' + id + '"]');
          var target = null;
          for (var i = 0; i < cands.length; i++) {
            if (cands[i].getClientRects().length) { target = cands[i]; break; }
          }
          if (!target) { bersihkanUrl(); return; }
          e.preventDefault();
          bersihkanUrl();
          var y = target.getBoundingClientRect().top + window.scrollY - 84;
          window.scrollTo({ top: y < 0 ? 0 : y, behavior: 'smooth' });
        }, true);

        // --- 2. Ruang Pameran dinamis: isi dari /api/pameran (dikelola via /admin).
        var css = [
          '.mp-section{position:relative;padding:7rem 1.5rem;max-width:80rem;margin:0 auto}',
          '.mp-kicker{display:flex;align-items:center;gap:.5rem;font-family:"Space Mono",monospace;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:#fbbf24;margin-bottom:.75rem}',
          '.mp-title{font-family:"Fraunces",Georgia,serif;font-size:clamp(1.9rem,4vw,3rem);color:#fff;letter-spacing:.02em;margin:0}',
          '.mp-sub{max-width:28rem;font-size:.875rem;color:#94a3b8;font-weight:300;line-height:1.7;margin-top:1rem}',
          '.mp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-top:3rem}',
          '.mp-card{background:#0f1117;border:1px solid rgba(255,255,255,.08);border-radius:1rem;padding:1.75rem;display:flex;flex-direction:column;gap:.6rem}',
          '.mp-card:hover{border-color:rgba(212,175,55,.45)}',
          '.mp-label{font-family:"Space Mono",monospace;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#d4af37}',
          '.mp-card h3{font-family:"Fraunces",Georgia,serif;font-size:1.35rem;color:#fff;margin:0;line-height:1.3}',
          '.mp-card p{font-size:.85rem;color:#94a3b8;font-weight:300;line-height:1.65;margin:0;flex:1}',
          '.mp-btn{margin-top:1rem;display:inline-flex;align-items:center;gap:.4rem;align-self:flex-start;background:linear-gradient(90deg,#fbbf24,#facc15);color:#000;font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:.65rem 1.1rem;border-radius:.6rem;text-decoration:none}',
          '.mp-btn:hover{filter:brightness(1.08)}',
          '.mp-empty{margin-top:3rem;border:1px dashed rgba(255,255,255,.15);border-radius:1rem;padding:2rem;text-align:center;color:#64748b;font-size:.875rem}',
          '.mp-berkas-btn{position:fixed;right:1rem;bottom:1rem;z-index:60;display:inline-flex;align-items:center;gap:.4rem;background:rgba(11,12,16,.88);border:1px solid rgba(212,175,55,.5);color:#fcd34d;font-family:"Space Mono",monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:.55rem .85rem;border-radius:999px;text-decoration:none;backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.45)}',
          '.mp-berkas-btn:hover{border-color:#d4af37;color:#fde68a}'
        ].join('');
        var style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);

        // --- 3. Tombol kecil akses berkas (PIN) di pojok kanan bawah.
        var berkasBtn = document.createElement('a');
        berkasBtn.href = '/berkas';
        berkasBtn.className = 'mp-berkas-btn';
        berkasBtn.textContent = '\uD83D\uDCC1 Berkas';
        (document.body || document.documentElement).appendChild(berkasBtn);

        function esc(s) {
          return String(s || '').replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function buildSection(items) {
          var sec = document.createElement('section');
          sec.id = 'ruang-pameran';
          sec.setAttribute('data-muse-rooms', '1');
          sec.className = 'mp-section';
          var cards;
          if (items && items.length) {
            cards = '<div class="mp-grid">' + items.map(function (it) {
              return '<article class="mp-card">' +
                (it.label ? '<div class="mp-label">' + esc(it.label) + '</div>' : '') +
                '<h3>' + esc(it.title) + '</h3>' +
                (it.description ? '<p>' + esc(it.description) + '</p>' : '<p></p>') +
                '<a class="mp-btn" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">Live Preview &#8599;</a>' +
                '</article>';
            }).join('') + '</div>';
          } else {
            cards = '<div class="mp-empty">Belum ada karya yang dipamerkan saat ini.</div>';
          }
          sec.innerHTML =
            '<div class="mp-kicker"><span>&#9670;</span><span>Koleksi Terpilih &bull; Gallery Rooms</span></div>' +
            '<h2 class="mp-title">Ruang Pameran Utama</h2>' +
            '<p class="mp-sub">Jelajahi setiap karya dalam bingkai pigura digital. Setiap item merepresentasikan solusi rekayasa terapan dengan paviliun interaktif yang dapat diakses langsung.</p>' +
            cards;
          return sec;
        }
        var done = false;
        function place() {
          if (done) return;
          var footer = document.getElementById('curator-desk') || document.querySelector('footer');
          if (!footer || !footer.parentNode) return;
          done = true;
          fetch('/api/pameran', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (d) { footer.parentNode.insertBefore(buildSection(d.items || []), footer); })
            .catch(function () { footer.parentNode.insertBefore(buildSection([]), footer); });
        }
        var obs2 = new MutationObserver(place);
        function start2() {
          place();
          if (document.body) obs2.observe(document.body, { childList: true, subtree: true });
          setTimeout(function () { obs2.disconnect(); }, 20000);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start2);
        else start2();
      })();
    </script>
